services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    c975L\PaymentBundle\:
        resource: '../src/'
        # Contract and Exception hold the gateway's value objects (CheckoutRequest, PaymentNotification) and its exception, built by hand from their scalars - registering them would ask the container to autowire a currency and an amount
        exclude: '../src/{Contract,DependencyInjection,Entity,Exception,Message}'

    # Before ShopBundle's own sheet (priority 10), which builds on the table and quantity rules declared here
    c975L\PaymentBundle\Service\StylesheetProvider:
        tags:
            - { name: 'ui.stylesheet', priority: 20 }
            - { name: 'ui.management_stylesheet' }

    # The basket controller is mounted by templates of this bundle and of the ones plugging into it, so the front layout loads it on every page
    c975L\PaymentBundle\Service\ScriptProvider:
        tags:
            - { name: 'ui.script', priority: 100 }

    c975L\PaymentBundle\Registry\PaymentGatewayRegistry:
        arguments:
            $gateways: !tagged_iterator payment.gateway

    c975L\PaymentBundle\Registry\BasketItemProviderRegistry:
        arguments:
            $providers: !tagged_iterator payment.basket_item_provider

    c975L\PaymentBundle\Registry\BasketRecommendationRegistry:
        arguments:
            $providers: !tagged_iterator payment.basket_recommendation_provider

    c975L\PaymentBundle\Registry\BasketDownloadRegistry:
        arguments:
            $providers: !tagged_iterator payment.basket_download_provider

    # The block saying what delivery costs, in the same "Boutique" group of the picker as the kinds ShopBundle offers - not cacheable, its two amounts being read from the configuration at render time and a cached copy outliving a change made to it
    payment.block.shipping:
        class: stdClass
        tags:
            - name: ui.block
              kind: payment_shipping
              label: 'label.block_shipping'
              description: 'label.block_shipping_description'
              translation_domain: 'payment'
              category: 'label.category_shop'
              form: 'c975L\PaymentBundle\Form\Block\ShippingBlockType'
              template: '@c975LPayment/blocks/Shipping.html.twig'
              pickable: true
              cacheable: false
